<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="System Failure Prank icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1E5B"/>
      <stop offset="1" stop-color="#0A0F2C"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D6BFF"/>
      <stop offset="1" stop-color="#0047D6"/>
    </linearGradient>
    <clipPath id="scr"><rect x="112" y="128" width="288" height="196" rx="14"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- monitor body -->
  <rect x="96" y="112" width="320" height="228" rx="28" fill="#E8EEFF"/>
  <rect x="112" y="128" width="288" height="196" rx="14" fill="url(#screen)"/>
  <!-- glitch slices -->
  <g clip-path="url(#scr)">
    <rect x="112" y="168" width="288" height="10" fill="#FF3B5C" opacity=".85"/>
    <rect x="150" y="262" width="250" height="6" fill="#22E3C4" opacity=".8"/>
    <rect x="112" y="290" width="120" height="4" fill="#FFFFFF" opacity=".35"/>
  </g>
  <!-- sad face :( with chromatic offset -->
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-weight="300" font-size="150">
    <text x="206" y="282" fill="#FF3B5C" opacity=".9">:(</text>
    <text x="200" y="278" fill="#22E3C4" opacity=".9">:(</text>
    <text x="203" y="280" fill="#FFFFFF">:(</text>
  </g>
  <!-- stand -->
  <path d="M226 340h60l14 44h-88z" fill="#C9D4F5"/>
  <rect x="176" y="380" width="160" height="18" rx="9" fill="#E8EEFF"/>
